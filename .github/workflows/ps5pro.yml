name: PS5 Pro Watcher

on:
  schedule:
    # Nur noch Notstart: Die Kette (siehe unten) laeuft rund um die Uhr weiter.
    # GitHub-Zeitplaene sind unzuverlaessig (am 25.11. kam kein einziger Start).
    - cron: "17 5 * * *"
    - cron: "47 10 * * *"
  workflow_dispatch:   # manuell starten ueber "Run workflow"
    inputs:
      mode:
        description: "chain = Dauerbetrieb, once = ein Check, test-alarm = Test-Push, now = sofort"
        default: "chain"
      minutes:
        description: "Laufzeit pro Kettenglied in Minuten (nur zum Testen aendern)"
        default: "340"

# Nie zwei Laeufe gleichzeitig (sonst doppelte Alarme). Ein wartender Lauf wird
# durch einen neueren ersetzt, so bleibt immer genau eine Kette uebrig.
concurrency:
  group: ${{ (github.event.inputs.mode == '' || github.event.inputs.mode == 'chain') && 'ps5pro' || format('ps5pro-test-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: write   # monatlicher Keepalive-Commit
  actions: write    # naechsten Lauf der Kette starten

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Scraper laufen lassen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ github.event.inputs.mode }}
          MAX_RUN_MINUTES: ${{ github.event.inputs.minutes }}
        run: |
          if [ -n "$MODE" ]; then
            python3 ps5pro_watch.py --$MODE
          else
            python3 ps5pro_watch.py
          fi

      # Kette: sofort den naechsten Lauf starten (ein Lauf darf max. 6 h dauern)
      - name: Naechsten Lauf starten
        if: always() && (github.event.inputs.mode == '' || github.event.inputs.mode == 'chain')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ps5pro.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=chain

      # GitHub schaltet geplante Workflows nach 60 Tagen ohne Commit ab.
      # Am 1. jedes Monats ein leerer Commit, damit er weiterlaeuft.
      - name: Keepalive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" -lt 12 ]; then
            git config user.name "ps5pro-bot"
            git config user.email "ps5pro-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi

      - name: Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps5pro-log-${{ github.run_id }}
          path: ps5pro_watch.log
          if-no-files-found: ignore
